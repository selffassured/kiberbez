<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>victim file</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <script src="index.js"></script>
    <div class="wrapper">
      <header class="container">
        <span class="logo"
          ><a href="index.html" class="logo" id="loginBtn">victim.file</a></span
        >
        <nav>
          <div class="search-container">
            <input
              type="search"
              id="fileSearch"
              class="search-field"
              placeholder="Search files"
            />
          </div>
        </nav>
        <a href="#" class="login">Login in</a>
        <!-- добавить ссылку -->
      </header>
    </div>

    <main class="content-container">
      <div class="content-box">
        <h2>Main page</h2>

        <div class="upload-container">
          <input type="file" id="file-upload" class="file-input" multiple />
          <label for="file-upload" class="download-button">
            Upload files
          </label>
        </div>

        <div class="file-list">
          <div class="file-item1 category-trigger active" data-category="all">
            <a href="#" class="file-item1">
              <img src="img/all files.png" class="file-image" />
              <span class="file-name" title="All files">All files</span>
            </a>
          </div>
          <div class="file-item1 category-trigger" data-category="documents">
            <a href="#" class="file-item1">
              <img src="img/documets.png" class="file-image" />
              <span class="file-name" title="documents">documents</span>
            </a>
          </div>
          <div class="file-item1 category-trigger" data-category="images">
            <a href="#" class="file-item1">
              <img src="img/photo.png" class="file-image" />
              <span class="file-name" title="images">images</span>
            </a>
          </div>
          <div class="file-item1 category-trigger" data-category="videos">
            <a href="#" class="file-item1">
              <img src="img/video.png" class="file-image" />
              <span class="file-name" title="videos">videos</span>
            </a>
          </div>
        </div>
        <div class="file-box" id="fileListContainer">
          <h3 class="file-show">File list ▸</h3>
        </div>
      </div>
    </main>
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Login to account</h2>
        <form id="loginForm">
          <div class="form-group">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Username or Email"
              required
            />
          </div>
          <div class="form-group">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              required
            />
          </div>
          <button type="submit" class="login-submit-btn" id="submitBtn">
            Login in
          </button>
        </form>
        <div class="modal-footer">
          <p id="modalFooterText">
            No account? <a href="#" class="auth-switch-link">Sign up</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
