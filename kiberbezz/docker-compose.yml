version: "3.8"
services:
  backend:
    build: ./backend
    container_name: secure_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app/files:/app/files
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: secure_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: postgres:15
    container_name: secure_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: fileshare
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: secure_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: